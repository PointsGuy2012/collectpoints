<!DOCTYPE html>
<html>
  <!--the website is hosted at PointsGuy2012.github.io/collectpoints-->
<head>
  <title>
    Collect Random Points V1
  </title>
</head>
<body>
<h1>this is proof the Brendon Leung made this website</h1>
  <h1>Current Points:</h1>
  <p id="pointsCount">0</p>
  <button id="Click for 1 point">Click for +1 Point</button>
  <script>
    const btn = document.getElementById("Click for 1 point");
      const pts = document.getElementById("pointsCount");

    let score = 0;
    
      btn.addEventListener('click',
      function(){
        pts.textContent = score;
      });
  </script>
</body>
</html>
