<!DOCTYPE html>
<html>
  <!--the website is hosted at PointsGuy2012.github.io/collectpoints-->
<head>
  <title>
    Collect Random Points V1
  </title>
</head>
<body>
  <h1>Hello, <span id="username"></span></h1>
  <h1>Current Points:</h1>
  <p id="pointsCount">0</p>
  <button id="Click for 1 point">Click for +1 Point</button>
  <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
  <button id="Click for 2 point">Click for +2 Points</button>
  <br>

  <script>
    const btn = document.getElementById("Click for 1 point");
    const pts = document.getElementById("pointsCount");
    const btn2 = document.getElementById("Click for 2 point");
    const userHeading = document.getElementById("username"); // Renamed to avoid error
    
    let userNameInput = prompt("What is your name?"); // Renamed to avoid error
    alert(`Hello, ${userNameInput}`);
    
    // This line injects the name straight into your HTML heading
    userHeading.textContent = userNameInput;
    
    let score = 0;
    
    // First button listener
    btn.addEventListener('click', function(){
      score += 1;
      alert('You got a point!');
      pts.textContent = score;
    });

    // Second button listener
    btn2.addEventListener('click', function(){
      score += 2;
      alert('You got 2 points for thinking outside the box!');
      pts.textContent = score;
    });
  </script>
</body>
</html>
